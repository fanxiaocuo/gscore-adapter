name: 构建并推送 preview 分支

# main 分支放 TypeScript 源码，用户不能直接拿来跑。
# 这里每次推送都编译一份 js 到 preview 分支，供想跟最新代码的用户直接 clone。
on:
  push:
    branches:
      - main
    # 只改文档时不必重新出包。
    # 注意 paths-ignore 不支持 "!" 取反（那是 paths 的语义），
    # 所以这里只列纯文档路径，不排除 .github/——
    # 改了 workflow 本身就该跑一次，验证改动没写坏。
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "LICENSE"
  workflow_dispatch:

# 同一分支上连续推送时，取消掉还在跑的旧任务，避免两个 job 抢着推 preview
concurrency:
  group: build-preview
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      # 与 df-plugin 不同：本插件的云崽类型来自 npm 包
      # @kaguyajs/trss-yunzai-types，不依赖本地路径，
      # 所以不需要先 checkout 云崽本体，直接检出插件即可。
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: 安装依赖
        run: pnpm install --frozen-lockfile=false

      # 出包前先过关卡。产物分支是用户直接 clone 的东西，
      # 编译不过或测试不过就不该推出去。
      - name: 类型检查
        run: pnpm run typecheck

      - name: Lint
        run: pnpm run lint

      # 构建必须排在测试前：test/run.js:18 跑的是 lib/ 下的编译产物，
      # 没有 lib/ 会直接报「找不到编译产物」退出。
      - name: 构建
        run: pnpm run build

      - name: 测试
        run: pnpm test

      - name: 准备产物
        run: |
          set -euo pipefail
          mkdir -p dist_branch

          # 以 package.json 的 files 字段为准，避免这里再维护一份清单
          for f in $(jq -r '.files[]' package.json); do
            if [ -e "$f" ]; then
              dest="dist_branch/$f"
              mkdir -p "$(dirname "$dest")"
              cp -R "$f" "$dest"
              echo "[copy] $f"
            else
              echo "[skip] $f 不存在"
            fi
          done

          cp package.json dist_branch/package.json
          echo "node_modules/" > dist_branch/.gitignore
          # 运行时生成的用户配置永远不该进产物分支
          echo "config/" >> dist_branch/.gitignore

          # sourcemap 指向 src/，而产物分支不含 src/，留着只会让
          # 报错栈指向不存在的文件，反而更难排查
          find dist_branch/lib -name "*.js.map" -delete
          find dist_branch/lib -name "*.js" -exec \
            sed -i '/^\/\/# sourceMappingURL=/d' {} +

          # 入口注释里「需执行 pnpm build」是对 main 分支源码说的，
          # 产物分支已经是编译好的 js，照做只会让用户困惑
          {
            echo '// 入口保持为 .js —— 框架 loader 只认 plugins/<name>/index.js。'
            echo '// 本分支是 main 分支 TypeScript 源码的编译产物，开箱可用，无需构建。'
            echo 'export * from "./lib/index.js"'
          } > dist_branch/index.js

      - name: 移除开发依赖
        run: |
          cd dist_branch
          # 用户装插件不需要 tsc/eslint 那一套
          pnpm pkg delete devDependencies scripts.build scripts.build:watch \
            scripts.typecheck scripts.lint scripts.lint:fix

      # 提交信息取自上游 commit，可能含引号/换行/反引号。
      # 经环境变量传递，不让它参与 YAML 与 shell 解析。
      - name: 组装提交信息
        id: msg
        env:
          HEAD_MSG: ${{ github.event.head_commit.message }}
          SHA: ${{ github.sha }}
        run: |
          subject=$(printf '%s' "${HEAD_MSG:-build: 手动触发构建}" | head -n 1)
          {
            echo "text<<COMMIT_MSG_EOF"
            printf '%s\n\n源提交 %s\n' "$subject" "$SHA"
            echo "COMMIT_MSG_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: 推送到 preview
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: preview
          publish_dir: dist_branch
          # 保留历史，用户 git pull 才能增量更新而不是每次重新克隆
          force_orphan: false
          full_commit_message: ${{ steps.msg.outputs.text }}
