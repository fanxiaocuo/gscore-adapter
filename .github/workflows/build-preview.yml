name: 构建并推送 preview 分支

# main 分支放 TypeScript 源码，用户不能直接拿来跑。
# 这里每次推送都编译一份 js 到 preview 分支，供想跟最新代码的用户直接 clone。
on:
  push:
    branches:
      - main
    # 只改文档时不必重新出包。
    # 注意 paths-ignore 不支持 "!" 取反（那是 paths 的语义），
    # 所以这里只列纯文档路径，不排除 .github/——
    # 改了 workflow 本身就该跑一次，验证改动没写坏。
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "LICENSE"
  workflow_dispatch:

# 同一分支上连续推送时，取消掉还在跑的旧任务，避免两个 job 抢着推 preview
concurrency:
  group: build-preview
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      # 与 df-plugin 不同：本插件的云崽类型来自 npm 包
      # @kaguyajs/trss-yunzai-types，不依赖本地路径，
      # 所以不需要先 checkout 云崽本体，直接检出插件即可。
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: 安装依赖
        run: pnpm install --frozen-lockfile=false

      # 出包前先过关卡。产物分支是用户直接 clone 的东西，
      # 编译不过或测试不过就不该推出去。
      - name: 类型检查
        run: pnpm run typecheck

      - name: Lint
        run: pnpm run lint

      # test/ 不入库（见 .gitignore），CI 克隆不到，故无测试步骤。
      # 测试只在本地跑：pnpm build && pnpm test。
      # 若日后把 test/ 改回入库，记得在这里补回：
      #   - name: 测试
      #     run: pnpm test
      # 顺序上必须排在「构建」之后，test/run.js 跑的是 lib/ 下的编译产物。
      - name: 构建
        run: pnpm run build

      # 锅巴面板是独立入口，主入口不引用它。文件存在 ≠ 导出存在：
      # 它被 tree-shaking 摇掉时产物照样生成，直到用户装上锅巴才炸
      # （Cannot find module / does not provide an export named）。
      # 这里真的 import 一次 guoba.support.js 并调用 supportGuoba()。
      - name: 冒烟：锅巴入口可加载
        run: |
          set -euo pipefail
          node --input-type=module -e '
            globalThis.logger = { info(){}, warn(){}, error(){}, mark(){}, debug(){} }
            const url = new URL("./guoba.support.js", `file://${process.cwd()}/`).href
            const m = await import(url)
            if (typeof m.supportGuoba !== "function")
              throw new Error("guoba.support.js 未导出 supportGuoba —— 多半是转调路径错了")
            const schemas = m.supportGuoba().configInfo.schemas
            if (!Array.isArray(schemas) || schemas.length === 0)
              throw new Error("supportGuoba() 没有返回配置项")
            console.log(`  ok  supportGuoba()，${schemas.length} 个配置项`)
            process.exit(0)
          '

      - name: 准备产物
        run: |
          set -euo pipefail
          mkdir -p dist_branch

          # 以 package.json 的 files 字段为准，避免这里再维护一份清单
          for f in $(jq -r '.files[]' package.json); do
            if [ -e "$f" ]; then
              dest="dist_branch/$f"
              mkdir -p "$(dirname "$dest")"
              cp -R "$f" "$dest"
              echo "[copy] $f"
            else
              echo "[skip] $f 不存在"
            fi
          done

          cp package.json dist_branch/package.json

          # 位图母版不进产物：页面只引用 .webp（见 render/assets.ts），
          # 同名 .png 是重新压缩时的源，留在仓库但白占 788KB。
          rm -f dist_branch/resources/template/image/logo.png \
                dist_branch/resources/template/image/frame-logo.png

          # 不写 .gitignore 到产物分支。
          # "config/" 这类无前导斜杠的规则会匹配任意层级的同名目录，
          # 在这个全新初始化的仓库里会连 resources/config/ 一起吞掉，
          # 导致首次运行没有默认配置模板可复制。
          # 该排除的东西在上面的复制清单里已经排除了。

          # 类型声明只对开发者有意义，纯使用者不需要，去掉减小体积
          find dist_branch/lib -name "*.d.ts" -delete

          # sourcemap 指向 src/，而产物分支不含 src/，留着只会让
          # 报错栈指向不存在的文件，反而更难排查
          find dist_branch/lib -name "*.js.map" -delete
          find dist_branch/lib -name "*.js" -exec \
            sed -i '/^\/\/# sourceMappingURL=/d' {} +

          # 入口注释里「需执行 pnpm build」是对 main 分支源码说的，
          # 产物分支已经是编译好的 js，照做只会让用户困惑
          {
            echo '// 入口保持为 .js —— 框架 loader 只认 plugins/<name>/index.js。'
            echo '// 本分支是 main 分支 TypeScript 源码的编译产物，开箱可用，无需构建。'
            echo 'export * from "./lib/index.js"'
          } > dist_branch/index.js

      - name: 移除开发依赖
        run: |
          cd dist_branch
          # 用户装插件不需要 tsc/eslint 那一套
          pnpm pkg delete devDependencies scripts.build scripts.build:css scripts.build:panel scripts.build:panel:css scripts.build:watch \
            scripts.typecheck scripts.lint scripts.lint:fix scripts.dev \
            scripts.test scripts.preview scripts.contrast \
            scripts.docs:dev scripts.docs:build scripts.docs:preview

      # 产物分支是用户直接 clone 就跑的东西，缺一个文件就是坏的。
      # 这里断言关键文件都在——上一版正是因为 .gitignore 的 config/
      # 规则把 resources/config/ 吞了，Actions 全绿但产物不可用。
      - name: 自检产物完整性
        run: |
          set -euo pipefail
          fail=0
          # lib/modules/guoba/index.js 必须单独列：guoba.support.js 只是个转调壳，
          # 它在不在说明不了目标在不在。锅巴面板曾经就是这样坏掉的——壳还在，
          # 而产物换了布局，转调指向一个不存在的路径。
          # webadapter/ 同理：index.js 是壳，转调的是 lib/modules/webadapter/index.js；
          # page.html / .css / .js 三个静态文件由宿主按白名单直接取，少一个就 403。
          for f in index.js lib/index.js lib/modules/guoba/index.js package.json \
                   resources/config/default_config.yaml \
                   resources/template/css/tailwind.css guoba.support.js \
                   webadapter/index.js lib/modules/webadapter/index.js \
                   webadapter/page.html webadapter/page.css webadapter/panel.js \
                   resources/template/image/logo.webp \
                   resources/template/image/frame-logo.webp; do
            if [ -e "dist_branch/$f" ]; then
              echo "  ok  $f"
            else
              echo "  !!  缺失 $f"
              fail=1
            fi
          done
          # 源码与开发配置不该出现在产物里
          for f in src tsconfig.json test .github docs; do
            if [ -e "dist_branch/$f" ]; then
              echo "  !!  不该出现 $f"
              fail=1
            fi
          done
          exit $fail

      # 提交信息取自上游 commit，可能含引号/换行/反引号。
      # 经环境变量传递，不让它参与 YAML 与 shell 解析。
      - name: 组装提交信息
        id: msg
        env:
          HEAD_MSG: ${{ github.event.head_commit.message }}
          SHA: ${{ github.sha }}
        run: |
          subject=$(printf '%s' "${HEAD_MSG:-build: 手动触发构建}" | head -n 1)
          {
            echo "text<<COMMIT_MSG_EOF"
            printf '%s\n\n源提交 %s\n' "$subject" "$SHA"
            echo "COMMIT_MSG_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: 推送到 preview
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: preview
          publish_dir: dist_branch
          # 保留历史，用户 git pull 才能增量更新而不是每次重新克隆
          force_orphan: false
          # 这不是 GitHub Pages 站点，不需要 .nojekyll 占位文件。
          # 该参数名义是「启用 jekyll」，实际效果就是不写那个文件。
          enable_jekyll: true
          full_commit_message: ${{ steps.msg.outputs.text }}
